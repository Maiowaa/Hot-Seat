<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex Duel</title>
<meta name="description" content="A Pokémon dex-number guessing game for 2–6 players on one screen. A secret National Pokédex number is drawn; closest guess wins the round.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --shell-red: #C23B3B;
    --shell-red-dark: #9E2E2E;
    --screen: #DCE8D6;
    --screen-dark: #1E2B20;
    --ink: #21201C;
    --paper: #F6F1E7;
    --amber: #E0A030;
    --p1: #3D6FB4;
    --p2: #C4693B;
    --p3: #4F8A5B;
    --p4: #8A5BA8;
    --p5: #B03A5B;
    --p6: #2E7D8A;
    --line: rgba(33,32,28,0.16);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 20px 14px 40px;
    min-height: 100vh;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--ink);
  }
  .masthead h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: 26px; margin:0; letter-spacing: -0.02em;
  }
  .masthead .tag{ font-size:12.5px; opacity:0.6; }

  /* ---------- setup ---------- */

  .setup{
    border:2px solid var(--ink); border-radius:14px; background:#fff;
    padding: 20px 18px 18px;
  }
  .setup h2{
    font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0 0 4px;
  }
  .setup .hint{ font-size:13px; opacity:0.62; margin:0 0 16px; line-height:1.5; }

  .countrow{ display:flex; gap:8px; margin-bottom:20px; }
  .countbtn{
    flex:1; padding:14px 0; border-radius:10px; cursor:pointer;
    border:2px solid var(--line); background:var(--paper);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;
    color:var(--ink); transition: all .13s ease;
  }
  .countbtn:hover{ border-color:var(--ink); }
  .countbtn.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .namegrid{ display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .namerow{ display:flex; align-items:center; gap:10px; }
  .namerow .swatch{ flex:none; }
  .namerow input{
    flex:1; padding:9px 11px; font-size:14px; border-radius:8px;
    border:1.5px solid var(--line); font-family:'Inter',sans-serif;
    background:var(--paper); color:var(--ink);
  }
  .namerow input:focus{ outline:2px solid var(--ink); outline-offset:1px; }

  /* ---------- scoreboard ---------- */

  .score{
    background: var(--ink); color:var(--paper); border-radius: 10px;
    padding: 11px 14px; margin-bottom: 18px; font-family:'Space Grotesk',sans-serif;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .score .roundchip{
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    opacity:0.7; padding-right:12px; border-right:1px solid rgba(255,255,255,0.22);
    flex:none;
  }
  .scores{ display:flex; gap:14px; flex-wrap:wrap; flex:1; }
  .sc{ display:flex; flex-direction:column; align-items:center; min-width:52px; }
  .sc .n{ font-size:20px; font-weight:700; line-height:1.1; }
  .sc .l{
    font-size:10px; opacity:0.72; text-transform:uppercase;
    letter-spacing:0.05em; max-width:76px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .sc.lead .n{ color: var(--amber); }

  /* ---------- shell ---------- */

  .shell{
    background: var(--shell-red);
    border: 3px solid var(--shell-red-dark);
    border-radius: 18px;
    padding: 16px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.18);
    margin-bottom: 18px;
  }
  .shell-dots{ display:flex; gap:6px; margin-bottom: 10px; }
  .dot{ width:9px; height:9px; border-radius:50%; background: rgba(255,255,255,0.55); }
  .dot.blue{ background:#5C8FC9; box-shadow:0 0 0 2px rgba(255,255,255,0.4) inset; }

  .screen{
    background: var(--screen-dark);
    color: var(--screen);
    border-radius: 8px;
    padding: 18px 16px;
    font-family: 'VT323', monospace;
    min-height: 110px;
    display:flex; flex-direction:column; justify-content:center; gap:6px;
  }
  .screen .label{ font-size:14px; opacity:0.7; letter-spacing:0.04em; }
  .screen .big{ font-size: 26px; line-height:1.35; }

  .hintbar{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .hintbtn{
    flex:1; min-width: 120px; background: rgba(255,255,255,0.16);
    color:#fff; border:1px solid rgba(255,255,255,0.35); border-radius:8px;
    padding:8px 10px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
    font-weight:500; transition: background 0.15s ease;
  }
  .hintbtn:hover:not(:disabled){ background: rgba(255,255,255,0.28); }
  .hintbtn:disabled{ opacity:0.45; cursor:default; }

  /* ---------- player cards ---------- */

  .players{ display:flex; flex-direction:column; gap:12px; margin-bottom: 16px; }
  .pcard{
    border:2px solid var(--ink); border-radius: 12px; padding: 13px 14px;
    background:#fff;
  }
  .pcard .who{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    margin-bottom:8px; display:flex; align-items:center; gap:8px;
  }
  .pcard .who .sub{ font-weight:400; opacity:0.55; }
  .swatch{ width:10px; height:10px; border-radius:50%; flex:none; }

  .p1{ border-color: var(--p1); } .p1 .swatch{ background:var(--p1); }
  .p2{ border-color: var(--p2); } .p2 .swatch{ background:var(--p2); }
  .p3{ border-color: var(--p3); } .p3 .swatch{ background:var(--p3); }
  .p4{ border-color: var(--p4); } .p4 .swatch{ background:var(--p4); }
  .p5{ border-color: var(--p5); } .p5 .swatch{ background:var(--p5); }
  .p6{ border-color: var(--p6); } .p6 .swatch{ background:var(--p6); }

  .ac-wrap{ position:relative; }
  input.guess{
    width:100%; padding: 10px 12px; font-size:15px; border-radius:8px;
    border: 1.5px solid var(--line); font-family:'Inter',sans-serif;
    background:var(--paper); color:var(--ink);
  }
  input.guess:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  input.guess.locked{ background:#eef3ea; border-color: #7fae7f; font-weight:600; }

  .suggestions{
    position:absolute; top:100%; left:0; right:0; background:#fff;
    border:1.5px solid var(--ink); border-radius:8px; margin-top:4px;
    max-height: 190px; overflow-y:auto; z-index: 20;
    box-shadow: 0 6px 14px rgba(0,0,0,0.14);
  }
  .suggestions div{ padding:8px 12px; font-size:14px; cursor:pointer; }
  .suggestions div:hover, .suggestions div.active{ background: #eef1e6; }
  .suggestions .none{ color:#888; font-style:italic; cursor:default; }

  .locked-note{ font-size:12px; color:#5c8a5c; margin-top:6px; min-height:15px; }

  /* ---------- buttons ---------- */

  button.primary{
    width:100%; padding: 13px; border:none; border-radius:10px;
    background: var(--ink); color:var(--paper); font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:15px; cursor:pointer; margin-bottom: 10px;
  }
  button.primary:disabled{ opacity:0.4; cursor:default; }
  button.primary:hover:not(:disabled){ background:#000; }

  button.secondary{
    width:100%; padding:11px; border-radius:10px; border:1.5px solid var(--ink);
    background:transparent; color:var(--ink); font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer; margin-bottom:8px;
  }
  button.secondary:hover{ background: rgba(33,32,28,0.06); }

  .ghost{
    display:block; width:100%; margin-top:2px; padding:8px;
    background:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:12.5px; opacity:0.55;
    color:var(--ink); text-decoration:underline;
  }
  .ghost:hover{ opacity:0.85; }

  /* ---------- reveal ---------- */

  .reveal{
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
    background:#fff; border:2px solid var(--ink);
  }
  .reveal .secret{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;
    margin-bottom:12px; text-align:center;
  }
  .reveal .secret .num{ color:var(--amber); }
  .guessrow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding: 8px 0; border-top: 1px solid var(--line); font-size:14px;
  }
  .guessrow:first-of-type{ border-top:none; }
  .guessrow .name{ font-weight:600; display:flex; align-items:center; gap:7px; }
  .guessrow .diff{ font-family:'VT323',monospace; font-size:17px; flex:none; }
  .guessrow.win{ background:rgba(224,160,48,0.13); border-radius:6px; padding-left:7px; padding-right:7px; }
  .guessrow.win .diff{ color:#9a6b12; font-weight:700; }
  .winner-tag{
    text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:15px; margin-top:10px; padding-top:10px; border-top:2px dashed var(--line);
  }

  .history{ margin-top: 10px; }
  .history summary{
    cursor:pointer; font-size:13px; font-weight:600; opacity:0.75; padding:6px 0;
  }
  .hrow{
    display:flex; justify-content:space-between; gap:10px; font-size:12.5px;
    padding: 5px 0; border-top:1px solid var(--line); opacity:0.85;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Dex Duel</h1>
    <div class="tag">closest guess wins the round</div>
  </div>

  <!-- ============ SETUP ============ -->
  <div id="setup">
    <div class="setup">
      <h2>How many players?</h2>
      <p class="hint">Everyone guesses at the same time on one screen. Closest dex number takes the round.</p>

      <div class="countrow" id="countRow"></div>

      <div class="namegrid" id="nameGrid"></div>

      <button class="primary" id="startBtn">Start game</button>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" style="display:none;">

    <div class="score">
      <div class="roundchip">Round <span id="roundnum">1</span></div>
      <div class="scores" id="scoreRow"></div>
    </div>

    <div class="shell">
      <div class="shell-dots"><div class="dot blue"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="screen">
        <div class="label">DEX NO.</div>
        <div class="big" id="hintline">A number has been picked from the dex. Get guessing!</div>
      </div>
      <div class="hintbar">
        <button class="hintbtn" id="hintGenBtn">Reveal generation</button>
        <button class="hintbtn" id="hintLenBtn">Reveal name length</button>
        <button class="hintbtn" id="hintLetterBtn">Reveal last letter</button>
      </div>
    </div>

    <div class="players" id="players"></div>

    <button class="primary" id="revealBtn" disabled>Lock in guesses &amp; reveal</button>

    <div id="revealBox"></div>

    <button class="secondary" id="nextBtn" style="display:none;">Next round</button>

    <details class="history" id="historyBox" style="display:none;">
      <summary>Round history</summary>
      <div id="historyList"></div>
    </details>

    <button class="ghost" id="resetBtn">Change players / restart</button>
  </div>

</div>

<script src="../data/dex-names.js"></script>
<script>
const POKEMON = window.DEX_NAMES;

const GENERATIONS = [
  {gen:1, region:"Kanto",   lo:1,   hi:151},
  {gen:2, region:"Johto",   lo:152, hi:251},
  {gen:3, region:"Hoenn",   lo:252, hi:386},
  {gen:4, region:"Sinnoh",  lo:387, hi:493},
  {gen:5, region:"Unova",   lo:494, hi:649},
  {gen:6, region:"Kalos",   lo:650, hi:721},
  {gen:7, region:"Alola",   lo:722, hi:809},
  {gen:8, region:"Galar/Hisui", lo:810, hi:905},
  {gen:9, region:"Paldea",  lo:906, hi:1025},
];

const MIN_PLAYERS = 2;
const MAX_PLAYERS = 6;

function genInfo(num){
  return GENERATIONS.find(g => num >= g.lo && num <= g.hi);
}

let state = {
  count: 2,
  names: ['Player 1','Player 2','Player 3','Player 4','Player 5','Player 6'],
  players: [],      // {id, idx, name, score}
  secretNum: null,
  round: 1,
  locked: {},       // id -> {name, num}
  history: [],
};

/* ============================ setup screen ============================ */

function renderSetup(){
  const row = document.getElementById('countRow');
  row.innerHTML = '';
  for(let n = MIN_PLAYERS; n <= MAX_PLAYERS; n++){
    const b = document.createElement('button');
    b.className = 'countbtn' + (n === state.count ? ' on' : '');
    b.textContent = n;
    b.addEventListener('click', () => {
      captureNames();
      state.count = n;
      renderSetup();
    });
    row.appendChild(b);
  }

  const grid = document.getElementById('nameGrid');
  grid.innerHTML = '';
  for(let i = 0; i < state.count; i++){
    const wrap = document.createElement('div');
    wrap.className = 'namerow p' + (i + 1);
    wrap.innerHTML =
      '<span class="swatch"></span>' +
      '<input type="text" maxlength="14" value="' + escapeAttr(state.names[i]) + '">';
    grid.appendChild(wrap);
  }
}

function captureNames(){
  document.querySelectorAll('#nameGrid input').forEach((inp, i) => {
    state.names[i] = inp.value.trim() || ('Player ' + (i + 1));
  });
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('startBtn').addEventListener('click', () => {
  captureNames();
  state.players = [];
  for(let i = 0; i < state.count; i++){
    state.players.push({ id: 'p' + (i + 1), idx: i, name: state.names[i], score: 0 });
  }
  state.round = 1;
  state.history = [];
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('historyBox').style.display = 'none';
  buildPlayerCards();
  newRound();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('game').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  renderSetup();
});

/* ============================ game screen ============================ */

function buildPlayerCards(){
  const host = document.getElementById('players');
  host.innerHTML = state.players.map(p =>
    '<div class="pcard ' + p.id + '">' +
      '<div class="who"><span class="swatch"></span>' + escapeHtml(p.name) +
        ' <span class="sub">— guess a species</span></div>' +
      '<div class="ac-wrap">' +
        '<input class="guess" id="input-' + p.id + '" placeholder="Start typing a name…" autocomplete="off">' +
        '<div class="suggestions" id="sugg-' + p.id + '" style="display:none;"></div>' +
      '</div>' +
      '<div class="locked-note" id="note-' + p.id + '"></div>' +
    '</div>'
  ).join('');

  state.players.forEach(p => setupAutocomplete(p));
}

function renderScores(){
  const best = Math.max.apply(null, state.players.map(p => p.score));
  document.getElementById('scoreRow').innerHTML = state.players.map(p =>
    '<div class="sc' + (p.score === best && best > 0 ? ' lead' : '') + '">' +
      '<div class="n">' + p.score + '</div>' +
      '<div class="l">' + escapeHtml(p.name) + '</div>' +
    '</div>'
  ).join('');
}

function randDex(){
  return Math.floor(Math.random() * POKEMON.length) + 1;
}

function newRound(){
  state.secretNum = randDex();
  state.locked = {};

  state.players.forEach(p => {
    const input = document.getElementById('input-' + p.id);
    input.value = '';
    input.classList.remove('locked');
    input.disabled = false;
    document.getElementById('note-' + p.id).textContent = '';
  });

  const hints = [
    ['hintGenBtn', 'Reveal generation'],
    ['hintLenBtn', 'Reveal name length'],
    ['hintLetterBtn', 'Reveal last letter'],
  ];
  hints.forEach(([id, label]) => {
    const b = document.getElementById(id);
    b.disabled = false;
    b.textContent = label;
  });

  document.getElementById('roundnum').textContent = state.round;
  document.getElementById('revealBox').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('hintline').textContent =
    `The dex number is #${state.secretNum}. Who is it?`;

  renderScores();
  updateRevealButton();
}

function allLocked(){
  return state.players.every(p => state.locked[p.id]);
}

function updateRevealButton(){
  const btn = document.getElementById('revealBtn');
  btn.disabled = !allLocked();
  const remaining = state.players.filter(p => !state.locked[p.id]).length;
  btn.textContent = remaining === 0
    ? 'Lock in guesses & reveal'
    : `Waiting on ${remaining} player${remaining === 1 ? '' : 's'}…`;
}

function setupAutocomplete(player){
  const input = document.getElementById('input-' + player.id);
  const sugg  = document.getElementById('sugg-' + player.id);
  const note  = document.getElementById('note-' + player.id);

  function clearLock(){
    delete state.locked[player.id];
    input.classList.remove('locked');
    note.textContent = '';
    updateRevealButton();
  }

  function lockValue(name){
    const idx = POKEMON.findIndex(p => p.toLowerCase() === name.toLowerCase());
    if(idx === -1) return;
    state.locked[player.id] = { name: POKEMON[idx], num: idx + 1 };
    input.value = POKEMON[idx];
    input.classList.add('locked');
    note.textContent = 'Locked in ✓ (spelling confirmed)';
    sugg.style.display = 'none';
    updateRevealButton();
  }

  input.addEventListener('input', () => {
    clearLock();
    const val = input.value.trim().toLowerCase();
    if(val.length === 0){ sugg.style.display = 'none'; return; }
    const matches = POKEMON.filter(p => p.toLowerCase().startsWith(val)).slice(0, 8);
    const extra = matches.length < 8
      ? POKEMON.filter(p => !p.toLowerCase().startsWith(val) && p.toLowerCase().includes(val)).slice(0, 8 - matches.length)
      : [];
    const all = matches.concat(extra);
    if(all.length === 0){
      sugg.innerHTML = '<div class="none">No matching name — check spelling</div>';
      sugg.style.display = 'block';
      return;
    }
    sugg.innerHTML = all.map(name => `<div data-name="${escapeAttr(name)}">${escapeHtml(name)}</div>`).join('');
    sugg.style.display = 'block';
  });

  sugg.addEventListener('mousedown', (e) => {
    const target = e.target.closest('div[data-name]');
    if(!target) return;
    lockValue(target.getAttribute('data-name'));
  });

  input.addEventListener('blur', () => {
    setTimeout(() => { sugg.style.display = 'none'; }, 120);
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      const val = input.value.trim();
      const exact = POKEMON.find(p => p.toLowerCase() === val.toLowerCase());
      if(exact) lockValue(exact);
    }
  });
}

/* ---------------------------- hints ---------------------------- */

document.getElementById('hintGenBtn').addEventListener('click', () => {
  const g = genInfo(state.secretNum);
  document.getElementById('hintline').textContent += ` It's from Generation ${g.gen} (${g.region}).`;
  const b = document.getElementById('hintGenBtn');
  b.disabled = true; b.textContent = 'Generation revealed';
});

document.getElementById('hintLenBtn').addEventListener('click', () => {
  const name = POKEMON[state.secretNum - 1];
  document.getElementById('hintline').textContent += ` Its name has ${name.replace(/\s/g,'').length} letters.`;
  const b = document.getElementById('hintLenBtn');
  b.disabled = true; b.textContent = 'Length revealed';
});

document.getElementById('hintLetterBtn').addEventListener('click', () => {
  const clean = POKEMON[state.secretNum - 1].replace(/\s/g,'');
  document.getElementById('hintline').textContent += ` It ends with the letter "${clean[clean.length-1].toUpperCase()}".`;
  const b = document.getElementById('hintLetterBtn');
  b.disabled = true; b.textContent = 'Letter revealed';
});

/* ---------------------------- reveal ---------------------------- */

document.getElementById('revealBtn').addEventListener('click', () => {
  if(!allLocked()) return;

  const secretNum  = state.secretNum;
  const secretName = POKEMON[secretNum - 1];

  const rows = state.players.map(p => {
    const g = state.locked[p.id];
    return { player: p, guess: g, delta: Math.abs(g.num - secretNum) };
  });

  const best    = Math.min.apply(null, rows.map(r => r.delta));
  const winners = rows.filter(r => r.delta === best);
  const sole    = winners.length === 1 ? winners[0].player : null;

  if(sole) sole.score++;

  const winnerText = sole
    ? `${escapeHtml(sole.name)} wins the round!`
    : `Tie between ${winners.map(w => escapeHtml(w.player.name)).join(' & ')} — no points.`;

  const sorted = rows.slice().sort((a, b) => a.delta - b.delta);

  document.getElementById('revealBox').innerHTML =
    '<div class="reveal">' +
      '<div class="secret">It was <span class="num">#' + secretNum + '</span> — ' + escapeHtml(secretName) + '!</div>' +
      sorted.map(r =>
        '<div class="guessrow' + (r.delta === best ? ' win' : '') + '">' +
          '<span class="name ' + r.player.id + '"><span class="swatch"></span>' +
            escapeHtml(r.player.name) + ': ' + escapeHtml(r.guess.name) + ' (#' + r.guess.num + ')</span>' +
          '<span class="diff">Δ' + r.delta + '</span>' +
        '</div>'
      ).join('') +
      '<div class="winner-tag">' + winnerText + '</div>' +
    '</div>';

  state.players.forEach(p => { document.getElementById('input-' + p.id).disabled = true; });
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('revealBtn').textContent = 'Revealed';
  document.getElementById('nextBtn').style.display = 'block';

  state.history.unshift({
    round: state.round,
    secretNum, secretName,
    winner: sole ? sole.name : null,
    tied: sole ? null : winners.map(w => w.player.name),
  });

  renderScores();
  renderHistory();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  state.round++;
  newRound();
});

function renderHistory(){
  const box  = document.getElementById('historyBox');
  const list = document.getElementById('historyList');
  box.style.display = 'block';
  list.innerHTML = state.history.map(h => {
    const w = h.winner ? escapeHtml(h.winner) + ' won' : 'Tie';
    return '<div class="hrow"><span>R' + h.round + ': #' + h.secretNum + ' ' +
           escapeHtml(h.secretName) + '</span><span>' + w + '</span></div>';
  }).join('');
}

renderSetup();
</script>
<script src="../shared/backlink.js"></script>
</body>
</html>
